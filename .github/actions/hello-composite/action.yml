name: Hello composite
description: Greets someone using shell steps

inputs:
  who:
    description: Who to greet
    required: true
    default: World

outputs:
  greeting:
    description: The full greeting
    value: ${{ steps.greet.outputs.greeting }}

runs:
  using: composite
  steps:
    - name: Build the greeting
      id: greet
      shell: bash
      env:
        WHO: ${{ inputs.who }}
      run: |
        greeting="Hello, $WHO! (composite action, bash $BASH_VERSION)"
        echo "$greeting"
        echo "greeting=$greeting" >> "$GITHUB_OUTPUT"
