name: "Hello Composite Action"
description: "A composite action to greet someone and print the current date"
author: "octocat@github.com"

inputs:
  my_name:
    description: "Who to greet"
    required: true
    default: "World"

outputs:
  greeting_message:
    description: "The greeting message"
    value: ${{ steps.greeting.outputs.greeting_message }}

runs:
  using: "composite"
  steps:
    - name: Print greeting
      run: echo "Hello ${{ inputs.my_name }}!"
      shell: bash 

    - name: Set greeting output
      id: greeting
      env:
        MY_NAME: ${{ inputs.my_name }}
      run: run: echo "greeting_message=Hello $MY_NAME!" >> "$GITHUB_OUTPUT"
      shell: bash 

    - name: Print current date
      run: date
      shell: bash 
